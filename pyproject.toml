[project]
name = "cookwithai"
version = "0.1.0"
description = "AI-powered recipe & pantry assistant (POC)"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["app"]
